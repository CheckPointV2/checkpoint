<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#6B4E33">
<title>CheckPoint — Rixos Bab Al Bahr</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="shared/assets/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="shared/assets/favicon-16.png">
<link rel="apple-touch-icon" href="shared/assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<noscript><link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"></noscript>
<link rel="stylesheet" href="shared/tokens.css">
<style>
  .cp-topbar-actions { display:flex; align-items:center; gap:8px; }
  .cp-loading { padding: 60px; text-align:center; color:var(--ink-soft); font-size:13px; }
</style>
</head>
<body>

<div class="cp-auth-gate" id="authGate">
  <form class="cp-auth-card" id="authForm">
    <img class="cp-auth-logo" src="shared/assets/rixos-logo.png" alt="Rixos Bab Al Bahr">
    <img class="cp-auth-mark" src="shared/assets/favicon-32.png" alt="">
    <h1 class="cp-serif">CheckPoint</h1>
    <div class="cp-auth-sub">Personal reference hub — enter the password</div>
    <input class="cp-input" type="password" id="authPass" autocomplete="current-password" autofocus placeholder="Password">
    <div class="cp-auth-error" id="authError">Incorrect password.</div>
    <button class="cp-btn cp-btn-primary" type="submit">Unlock</button>
  </form>
</div>

<div class="cp-app" id="mainApp" style="display:none">

  <div class="cp-dock-wrap no-print">
    <div class="cp-dock">
      <div class="cp-dock-brand">
        <img class="cp-dock-mark" src="shared/assets/favicon-32.png" alt="Rixos">
        <span class="cp-dock-word cp-serif">CheckPoint</span>
      </div>
      <div class="cp-dock-sep"></div>

      <nav class="cp-dock-nav">
        <button class="cp-dock-btn" data-route="#/roomguide" data-tip="Room Guide" title="Room Guide" aria-label="Room Guide">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-6 9 6v11a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></svg>
        </button>
        <button class="cp-dock-btn" data-route="#/departures" data-sub="departures" data-tip="Departures" title="Departures" aria-label="Departures">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="8" width="16" height="12" rx="2"/><path d="M9 8V6a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2M4 13h16"/></svg>
        </button>
        <button class="cp-dock-btn" data-route="#/departures" data-sub="checkouts" data-tip="Checkouts" title="Checkouts" aria-label="Checkouts">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 5h14v10H9l-4 4z"/><path d="M9 10l2 2 4-4"/></svg>
        </button>
        <button class="cp-dock-btn" data-route="#/allocation" data-tip="Allocation Copilot" title="Allocation Copilot" aria-label="Allocation Copilot">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
        </button>
      </nav>

      <div class="cp-dock-sep"></div>
      <div class="cp-dock-utils">
        <button class="cp-dock-btn" id="searchTrigger" data-tip="Search (⌘K)" title="Search (⌘K)" aria-label="Search (⌘K)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        </button>
        <button class="cp-dock-btn" id="printBtn" data-tip="Print this view" title="Print this view" aria-label="Print this view">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9V3h12v6M6 18H4a1 1 0 0 1-1-1v-6a1 1 0 0 1 1-1h16a1 1 0 0 1 1 1v6a1 1 0 0 1-1 1h-2M6 14h12v7H6z"/></svg>
        </button>
        <button class="cp-dock-btn" id="themeBtn" data-tip="Toggle theme" title="Toggle theme" aria-label="Toggle theme">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        </button>
        <button class="cp-dock-btn" id="lockBtn" data-tip="Lock" title="Lock" aria-label="Lock">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="11" width="16" height="9" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
        </button>
      </div>
    </div>
  </div>

  <div class="cp-content">
    <div id="viewRoot" style="flex:1; position:relative;">
      <!-- tool views are mounted here on demand, Room Guide first on boot -->
    </div>
  </div>

</div>

<div class="cp-palette-overlay" id="paletteOverlay" role="dialog" aria-modal="true" aria-label="Search">
  <div class="cp-palette">
    <input class="cp-palette-input" id="paletteInput" placeholder="Search rooms, templates, tools…" autocomplete="off" role="combobox" aria-expanded="true" aria-controls="paletteResults" aria-autocomplete="list">
    <div class="cp-palette-results" id="paletteResults" role="listbox"></div>
  </div>
</div>

<script src="shared/app.js"></script>
</body>
</html>
