<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#6B4E33">
<title>CheckPoint</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔑</text></svg>">
<link rel="stylesheet" href="shared/tokens.css">
<style>
  .cp-topbar { display:flex; align-items:center; gap:12px; padding:14px 28px; border-bottom:1px solid var(--line); background:var(--panel); }
  .cp-topbar-title { font-family: var(--font-display); font-weight:600; font-size:16px; }
  .cp-topbar-actions { margin-left:auto; display:flex; align-items:center; gap:8px; }
  .cp-icon-btn { width:36px; height:36px; border-radius:9px; border:1px solid var(--line); background:var(--panel); color:var(--ink-soft); display:flex; align-items:center; justify-content:center; cursor:pointer; }
  .cp-icon-btn:hover { color:var(--ink); background:var(--paper); }
  .cp-icon-btn svg { width:17px; height:17px; }
  .cp-loading { padding: 60px; text-align:center; color:var(--ink-soft); font-size:13px; }
  @media (max-width: 720px) {
    .cp-app { flex-direction: column; }
    .cp-sidebar { width:100%; height:auto; position:static; border-right:none; border-bottom:1px solid var(--line); }
  }
</style>
</head>
<body>

<div class="cp-auth-gate" id="authGate">
  <form class="cp-auth-card" id="authForm">
    <div class="cp-brand-mark" style="margin:0 auto;">CP</div>
    <h1>CheckPoint</h1>
    <div class="cp-auth-sub">Personal reference hub — enter the password</div>
    <input class="cp-input" type="password" id="authPass" autocomplete="current-password" autofocus placeholder="Password">
    <div class="cp-auth-error" id="authError">Incorrect password.</div>
    <button class="cp-btn cp-btn-primary" type="submit">Unlock</button>
  </form>
</div>

<div class="cp-app" id="mainApp" style="display:none">

  <aside class="cp-sidebar">
    <div class="cp-brand">
      <div class="cp-brand-mark">CP</div>
      <div>
        <div class="cp-brand-title">CheckPoint</div>
        <div class="cp-brand-sub">Mastertool</div>
      </div>
    </div>

    <button class="cp-search-trigger" id="searchTrigger" type="button">
      <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      Search anything
      <kbd>⌘K</kbd>
    </button>

    <nav class="cp-nav">
      <a class="cp-nav-link" data-route="#/" href="#/">
        <span class="cp-nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg></span>
        <span class="cp-nav-name">Home</span>
      </a>

      <a class="cp-nav-link" data-route="#/roomguide" href="#/roomguide">
        <span class="cp-nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-6 9 6v11a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></svg></span>
        <span class="cp-nav-name">Room Guide</span>
      </a>

      <div class="cp-nav-group" id="group-departures">
        <button class="cp-nav-toggle" data-group="departures" type="button">
          <span class="cp-nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="8" width="16" height="12" rx="2"/><path d="M9 8V6a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2M4 13h16"/></svg></span>
          <span class="cp-nav-name">Departures</span>
          <span class="cp-nav-caret">›</span>
        </button>
        <div class="cp-nav-dropdown">
          <a data-route="#/departures" data-sub="departures" href="#/departures">Departures</a>
          <a data-route="#/departures" data-sub="checkouts" href="#/departures">Checkouts</a>
        </div>
      </div>

      <a class="cp-nav-link" data-route="#/email" href="#/email">
        <span class="cp-nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg></span>
        <span class="cp-nav-name">Email Templates</span>
      </a>
    </nav>

    <div class="cp-sidebar-footer">
      <span>Personal hub — not shared</span>
      <button id="lockBtn" type="button" title="Lock">Lock</button>
    </div>
  </aside>

  <div class="cp-content">
    <div class="cp-topbar no-print">
      <div class="cp-topbar-title" id="topbarTitle">Home</div>
      <div class="cp-topbar-actions">
        <button class="cp-icon-btn" id="printBtn" title="Print this view">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9V3h12v6M6 18H4a1 1 0 0 1-1-1v-6a1 1 0 0 1 1-1h16a1 1 0 0 1 1 1v6a1 1 0 0 1-1 1h-2M6 14h12v7H6z"/></svg>
        </button>
        <button class="cp-icon-btn" id="themeBtn" title="Toggle theme">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        </button>
      </div>
    </div>

    <div id="viewRoot" style="flex:1; position:relative;">
      <div class="cp-view active" id="view-home">
        <div class="cp-home">
          <div class="cp-home-greet cp-serif" id="homeGreet">Welcome back</div>
          <div class="cp-home-date" id="homeDate"></div>

          <div class="cp-stat-grid" id="homeStats"></div>

          <div class="cp-home-links">
            <button class="cp-card cp-quicklink" data-route="#/roomguide">
              <div class="cp-quicklink-title">Room Guide</div>
              <div class="cp-quicklink-sub">Floor plans, features, upsell &amp; late checkout</div>
            </button>
            <button class="cp-card cp-quicklink" data-route="#/departures" data-sub="departures">
              <div class="cp-quicklink-title">Departures</div>
              <div class="cp-quicklink-sub">Due-outs, checkouts, room finder, day list</div>
            </button>
            <button class="cp-card cp-quicklink" data-route="#/email">
              <div class="cp-quicklink-title">Email Templates</div>
              <div class="cp-quicklink-sub">Guest Relations message library</div>
            </button>
          </div>
        </div>
      </div>
      <!-- other tool views are mounted here on demand -->
    </div>
  </div>

</div>

<div class="cp-palette-overlay" id="paletteOverlay">
  <div class="cp-palette">
    <input class="cp-palette-input" id="paletteInput" placeholder="Search rooms, templates, tools…" autocomplete="off">
    <div class="cp-palette-results" id="paletteResults"></div>
  </div>
</div>

<script src="shared/app.js"></script>
</body>
</html>
